[project]
name = "ir-review-agent"
version = "0.1.0"
description = "IR開示資料のレビュー・翻訳を行うエージェント。決定論的な検査とLLMレビューを分離した構成"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
ir-review = "ir_review.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ir_review"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer は引数のデフォルト値に Option/Argument を置くのが標準的な書き方のため
"src/ir_review/cli.py" = ["B008"]
# web.py は HTML/CSS/JS を埋め込んだ文字列。Python の行長規則を当てても読みやすくならない
"src/ir_review/web.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ir_review"]

[[tool.mypy.overrides]]
# anthropic は optional-dependencies。未インストールの環境でも型チェックを通せるようにする
module = ["anthropic.*"]
ignore_missing_imports = true
