# Render Blueprint。リポジトリを接続して Blueprint から作成できる。
#
# ANTHROPIC_API_KEY と IR_REVIEW_ACCESS_KEY は sync: false にしてあるので、
# リポジトリには入らず、Render のダッシュボードで個別に設定する。
services:
  - type: web
    name: ir-review-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: IR_REVIEW_ACCESS_KEY
        sync: false
      - key: IR_REVIEW_MODEL
        value: claude-sonnet-4-5
      # 公開デモなので上限を手元より厳しくする
      - key: IR_REVIEW_MAX_PAGES
        value: "3"
      - key: IR_REVIEW_MAX_SEGMENTS
        value: "25"
      - key: IR_REVIEW_RATE_LIMIT_PER_HOUR
        value: "5"
